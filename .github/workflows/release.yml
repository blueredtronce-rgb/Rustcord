# Builds Rustcord's installers on Windows, Linux and macOS. Never runs on pushes or pull
# requests; start it by hand (Actions > release > Run workflow) or push a tag v<version>.
# - Run by hand: tests, then the packages as workflow artifacts. With "check_only": fmt, clippy
#   and tests on all three systems, no packages.
# - Tag v<version> (must equal Cargo.toml's version): the packages, the self-updater's signed
#   feed (latest.json + latest.json.sig, docs/UPDATER_DESIGN.md) and SHA256SUMS in a draft
#   release, which is published by hand. Signing needs the secret RUSTCORD_UPDATE_SIGNING_KEY.
# Actions are pinned to commits: the packages are signed and installed by the self-updater.
name: release

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Only check (fmt, clippy, tests), build no packages
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The cached default target dir (scripts/build-installer.ps1 would pick C:\rc-target).
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1
            artifact: dist/Rustcord-Setup-*.exe
          # glibc 2.35: the packages run on Ubuntu 22.04+, Debian 12+, Fedora 36+.
          - os: ubuntu-22.04
            package: bash scripts/build-linux.sh
            artifact: |
              dist/*.deb
              dist/*.tar.gz
          # Apple silicon; the Intel half is cross-built with Xcode's SDK.
          - os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            package: bash scripts/build-macos.sh
            artifact: |
              dist/*.dmg
              dist/*.app.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libssl-dev nasm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-${{ inputs.check_only && 'check' || 'package' }}

      - name: Format
        if: inputs.check_only
        # shortcut: report only, the tree is not rustfmt-formatted yet (no rustfmt.toml); make it
        # blocking after a one-time `cargo fmt`.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        if: inputs.check_only
        run: cargo clippy --locked --all-targets -- -D warnings

      # Packaging runs skip the macOS tests: macOS minutes cost ten times as much.
      - name: Tests
        if: inputs.check_only || runner.os != 'macOS'
        run: cargo test --locked

      - name: Package
        if: ${{ !inputs.check_only }}
        run: ${{ matrix.package }}

      - name: Check the Linux packages
        if: ${{ !inputs.check_only && runner.os == 'Linux' }}
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          prefix=$RUNNER_TEMP/install-test
          export RUSTCORD_SETUP_TEST=1 RUSTCORD_SETUP_PREFIX=$prefix
          sh "$RUNNER_TEMP"/rustcord-*/install.sh
          test -x "$prefix/.local/bin/rustcord"
          test -f "$prefix/.local/share/applications/rustcord.desktop"
          test -f "$prefix/.config/autostart/rustcord.desktop"
          # The self-updater's --update: replaces the app, never writes the login entry.
          rm "$prefix/.config/autostart/rustcord.desktop"
          sh "$RUNNER_TEMP"/rustcord-*/install.sh --update
          test -x "$prefix/.local/bin/rustcord"
          test ! -e "$prefix/.config/autostart/rustcord.desktop"
          if RUSTCORD_SETUP_PREFIX=$RUNNER_TEMP/empty-prefix sh "$RUNNER_TEMP"/rustcord-*/install.sh --update; then
            echo "::error::install.sh --update installed where nothing was installed"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/empty-prefix"
          sh "$prefix/.local/share/rustcord/install.sh" --uninstall --purge
          if [ -e "$prefix" ]; then find "$prefix"; echo "::error::install.sh --uninstall left files behind"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.check_only }}
        with:
          name: rustcord-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.check_only
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The update signing key, the manifest script (before the download: checkout cleans).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Update manifest
        run: |
          python3 scripts/make-update-manifest.py --self-test
          python3 scripts/make-update-manifest.py dist --require-all

      # Never `set -x` here. The key lives only in this step's env and, briefly, in RUNNER_TEMP.
      - name: Sign the update manifest
        env:
          SIGNING_KEY: ${{ secrets.RUSTCORD_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING_KEY:-}" ]; then echo "::error::RUSTCORD_UPDATE_SIGNING_KEY is not set"; exit 1; fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/update-key.pem"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update-key.pem" -rawin -in dist/latest.json -out "$RUNNER_TEMP/sig.bin"
          rm -f "$RUNNER_TEMP/update-key.pem"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > dist/latest.json.sig

      # Against the key the apps carry: a wrong secret fails here, not on users' machines.
      - name: Verify the signature
        run: |
          # The DER SubjectPublicKeyInfo prefix of an Ed25519 key, then the raw 32 bytes.
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; base64 -d assets/update-signing.pub; } > "$RUNNER_TEMP/pub.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" -out "$RUNNER_TEMP/pub.pem"
          base64 -d dist/latest.json.sig > "$RUNNER_TEMP/sig.bin"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in dist/latest.json -sigfile "$RUNNER_TEMP/sig.bin"

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Rustcord ${GITHUB_REF_NAME#v}" --generate-notes dist/*
