# Builds the website (site/) with the README screenshots and the logo and deploys it to
# GitHub Pages (https://r0sc.github.io/Rustcord/). Actions are pinned to commits, like release.yml.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the download logic
        run: node --test site/test.mjs
      - name: Assemble the site
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends webp
          mkdir -p _site/shots
          cp -r site/. _site/
          rm _site/test.mjs
          for s in main stream profile plugins light; do
            cwebp -quiet -q 80 -m 6 "docs/screenshots/$s.png" -o "_site/shots/$s.webp"
            cwebp -quiet -q 80 -m 6 -resize 960 0 "docs/screenshots/$s.png" -o "_site/shots/$s-960.webp"
          done
          cp docs/screenshots/main.png _site/shots/og.png
          cp assets/logo.svg _site/logo.svg
          cp assets/logo-small.svg _site/favicon.svg
          cp assets/icons/rustcord-32.png _site/icon-32.png
          cp assets/icons/rustcord-256.png _site/icon-256.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
